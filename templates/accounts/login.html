{% extends "base.html" %}
{% block title %}Sign in · {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="narrow" style="padding-top:2.5rem">
  <h1>Sign in</h1>
  <p class="muted">No password needed — we'll send a code to your phone.</p>
  <form method="post" class="card">
    {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    {% include "includes/form.html" %}
    <button class="btn btn-block" type="submit">Send code</button>
  </form>
  <p class="muted" style="margin-top:1rem">Changed your number? <a href="/login/email/">Sign in with your email instead</a>.</p>
</div>
{% endblock %}
