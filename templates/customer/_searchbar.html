<form class="searchbar" method="get" action="/search/" role="search">
  <div class="sf"><label for="s-cat">Service</label>
  <select id="s-cat" name="category"><option value="">All services</option>
    {% for c in categories %}<option value="{{ c.slug }}"{% if c.slug == cat %} selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
  <div class="sf"><label for="s-town">Town</label>
  <select id="s-town" name="town"><option value="">All towns</option>
    {% for t in towns %}<option value="{{ t.slug }}"{% if t.slug == town %} selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></div>
  <button class="btn" type="submit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</button>
</form>
