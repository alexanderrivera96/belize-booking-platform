# Render Blueprint for BookBZ (architecture plan, Stage 1 hosting).
# New → Blueprint → pick this repo. Creates: database, Redis (Key Value), public site,
# admin console, and one background worker (Celery worker + beat in one process for the pilot).
# Region "virginia" (US East) is the closest Render region to Belize.

envVarGroups:
  - name: bookbz-shared
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PLATFORM_NAME
        value: BookBZ
      - key: PAYMENTS_ENABLED
        value: "0"
      # Switch both to "twilio" after adding TWILIO_* keys to this group (see DEPLOY.md).
      - key: OTP_BACKEND
        value: console
      - key: MESSAGING_BACKEND
        value: console
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: bookbz-db
    region: virginia
    postgresMajorVersion: "16"
    databaseName: bookbz
    user: bookbz
    ipAllowList: []            # internal connections only

services:
  - type: keyvalue
    name: bookbz-redis
    region: virginia
    plan: free                 # enough for the Celery queue in the pilot; reminders themselves live in Postgres
    ipAllowList: []            # internal connections only
    maxmemoryPolicy: noeviction

  # Customer website + provider dashboard + /api/v1
  - type: web
    name: bookbz-web
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py seed_reference_data && python manage.py setup_admin_groups
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 30
    healthCheckPath: /healthz
    envVars:
      - fromGroup: bookbz-shared
      - key: SITE_ROLE
        value: public
      - key: DATABASE_URL
        fromDatabase: {name: bookbz-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: bookbz-redis, property: connectionString}
      - key: DJANGO_ALLOWED_HOSTS
        sync: false            # your domain(s), e.g. bookbz.com,www.bookbz.com — blank is fine at first
      - key: PUBLIC_BASE_URL
        sync: false            # e.g. https://bookbz.com — blank uses the onrender.com address

  # Platform admin console (separate host, own cookie, MFA)
  - type: web
    name: bookbz-admin
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 30
    healthCheckPath: /healthz
    envVars:
      - fromGroup: bookbz-shared
      - key: SITE_ROLE
        value: admin
      - key: DATABASE_URL
        fromDatabase: {name: bookbz-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: bookbz-redis, property: connectionString}
      - key: ADMIN_ALLOW_SELF_ENROLL
        value: "1"             # set to 0 once every admin has set up their authenticator
      - key: DJANGO_ALLOWED_HOSTS
        sync: false            # e.g. admin.bookbz.com — blank is fine at first

  # Messages, reminders and every-minute sweeps. Keep exactly ONE instance (beat runs inside it).
  - type: worker
    name: bookbz-worker
    runtime: python
    region: virginia
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -B -l info --concurrency 2
    envVars:
      - fromGroup: bookbz-shared
      - key: SITE_ROLE
        value: public
      - key: DATABASE_URL
        fromDatabase: {name: bookbz-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: bookbz-redis, property: connectionString}
      - key: PUBLIC_HOST
        fromService: {type: web, name: bookbz-web, property: host}
      - key: PUBLIC_BASE_URL
        sync: false            # same value as on bookbz-web once you add your domain
