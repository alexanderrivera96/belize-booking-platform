# Local development stack. Customer site + provider dashboard on :8000, admin console on :8001.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_reference_data && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    env_file: .env
    environment: &common
      DATABASE_URL: postgres://booking:booking@db:5432/booking
      REDIS_URL: redis://redis:6379/0
      SITE_ROLE: public
    ports: ["8000:8000"]
    depends_on: [db, redis]

  admin:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8001
    env_file: .env
    environment:
      <<: *common
      SITE_ROLE: admin
    ports: ["8001:8001"]
    depends_on: [web]

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment: *common
    depends_on: [db, redis]

  beat:
    build: .
    command: celery -A config beat -l info   # exactly one instance
    env_file: .env
    environment: *common
    depends_on: [db, redis]

volumes:
  pgdata:
